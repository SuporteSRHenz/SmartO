plugins {
    id 'com.android.application'
}

android {
    namespace 'com.oliveira.controlelocal'
    compileSdk 35

    defaultConfig {
        applicationId 'com.oliveira.controlelocal'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'app-release.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'app-release'
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
